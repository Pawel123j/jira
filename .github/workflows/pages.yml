name: Deploy na GitHub Pages

# Aplikacja jest w całości kliencka (stan w localStorage, brak backendu),
# więc statyczny hosting wystarcza jej w zupełności.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wdrożenie naraz; nie przerywamy trwającego, żeby nie zostawić
# Pages w stanie w połowie zaktualizowanym.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # jsdom 30 (przez undici) wymaga ^22.22.2 || ^24.15.0 || >=26.
          # Na Node 20 workery Vitesta wywracały się na
          # `webidl.util.markAsUncloneable is not a function`, zanim
          # uruchomił się choć jeden test.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        # Pages serwuje pod /<nazwa-repo>/, stąd base ustawiony zmienną.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: SPA fallback
        # Pages nie ma przepisywania ścieżek. Kopia index.html jako 404.html
        # sprawia, że wejście pod dowolny adres pokazuje aplikację zamiast
        # strony błędu GitHuba.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
