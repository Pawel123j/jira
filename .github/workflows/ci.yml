name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimalne uprawnienia GITHUB_TOKEN (hardening 2026-11); joby potrzebujące więcej
# deklarują je jawnie.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # jsdom 30 (przez undici) wymaga ^22.22.2 || ^24.15.0 || >=26.
          # Na Node 20 workery Vitesta wywracały się na
          # `webidl.util.markAsUncloneable is not a function`, zanim
          # uruchomił się choć jeden test.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Audyt zależności
        # Blokujemy na `high`, a nie na `low`: przy niższym progu pierwszy
        # nowy komunikat o podatności w dowolnej zależności deweloperskiej
        # zapalałby CI na czerwono na commicie, którego nikt nie dotykał.
        run: npm run security:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
