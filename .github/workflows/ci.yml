name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # jsdom 30 (przez undici) wymaga ^22.22.2 || ^24.15.0 || >=26.
          # Na Node 20 workery Vitesta wywracały się na
          # `webidl.util.markAsUncloneable is not a function`, zanim
          # uruchomił się choć jeden test.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Audyt zależności
        # Każda niezałatana podatność blokuje CI, niezależnie od poziomu.
        # Jedyny wyjątek wymaga sprawdzenia dokładnej łatki i terminu przeglądu.
        run: npm run security:check

      - name: Test
        run: |
          npm run test:security
          npm test

      - name: Build
        run: npm run build
