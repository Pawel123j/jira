name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Audyt zależności
        # Blokujemy na `high`, a nie na `low`: przy niższym progu pierwszy
        # nowy komunikat o podatności w dowolnej zależności deweloperskiej
        # zapalałby CI na czerwono na commicie, którego nikt nie dotykał.
        run: npm audit --audit-level=high

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
